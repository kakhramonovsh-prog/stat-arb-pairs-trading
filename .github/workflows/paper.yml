name: paper

# Renders paper/paper.md to PDF from a clean checkout. The PDF is uploaded
# as an artifact; the committed paper/paper.pdf is a copy of it.

on:
  push:
    paths:
      - 'paper/**'
      - '.github/workflows/paper.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pandoc and XeLaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc texlive-xetex texlive-latex-extra fonts-dejavu
      - name: Build the PDF
        run: |
          pandoc paper/paper.md -o paper/paper.pdf \
            --pdf-engine=xelatex \
            --columns=120 \
            -V mainfont="DejaVu Serif" \
            -V geometry:margin=1in \
            -V fontsize=11pt \
            -V colorlinks=true
      - uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper/paper.pdf
          if-no-files-found: error
